name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Run unit tests
        run: lua5.4 tests/test.lua
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
          install: false
      - name: Test current release discovery
        env:
          MISE_USE_VERSIONS_HOST: 0
        run: |
          mise plugins link mysql "$GITHUB_WORKSPACE"
          latest="$(mise latest mysql)"
          test "$latest" != "8.0.33"
          mise ls-remote mysql | grep -Fx "$latest"
      - name: Test system dependency metadata
        env:
          MISE_SYSTEM_DEPS: warn
          MISE_USE_VERSIONS_HOST: 0
        run: mise install mysql@latest --dry-run
